<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutas Alternas Playa | Turismo Comunitario y Recreativo</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo-rutas_alternas.jpeg" alt="Logo Rutas Alternas Playa">
            <h1>Rutas Alternas Playa</h1>
        </div>
        <p>Directorio y Mapa Interactivo de Lugares Recreativos y Gastronomía Local</p>
    </header>

    <section class="filter-container">
        <label for="categoria">Filtrar por Especialidad:</label>
        <select id="categoria">
            <option value="todos">Todas las opciones</option>
            <option value="recreativo">Espacios Recreativos y Cenotes Urbanos</option>
            <option value="japonesa">Comida Japonesa de Colonia</option>
            <option value="mexicana">Fondas y Gastronomía Tradicional</option>
            <option value="artesanias">Talleres Culturales y Artesanías</option>
        </select>
        
        <button class="btn-search" onclick="filtrarMapa()">Filtrar Mapa</button>
        <button class="btn-add" onclick="abrirModal()">+ Agregar Nuevo Lugar</button>
        <button class="btn-cancel" onclick="cerrarSesion()" style="margin-left: 10px;">Cerrar Sesión</button>
    </section>

    <main>
        <div id="map"></div>
        <h2>Lugares Recreativos y Gastronómicos Recomendados</h2>
        <div class="cards-grid" id="contenedorTarjetas"></div>
    </main>

    <div id="modalAgregar" class="modal">
        <div class="modal-content">
            <h3>Agregar Nuevo Lugar</h3>
            <form id="formAgregarLugar" onsubmit="guardarLugarBD(event)">
                <input type="text" id="nuevoNombre" placeholder="Nombre del lugar" required>
                
                <select id="nuevaCategoria" required>
                    <option value="" disabled selected>Selecciona una categoría</option>
                    <option value="recreativo">Espacio Recreativo / Cenote</option>
                    <option value="japonesa">Comida Japonesa</option>
                    <option value="mexicana">Fonda / Comida Mexicana</option>
                    <option value="artesanias">Taller Cultural / Artesanías</option>
                </select>

                <input type="text" id="nuevaEspecialidad" placeholder="Especialidad (ej. Ramen, Tacos, Cenote)" required>
                <input type="text" id="nuevaColonia" placeholder="Colonia (ej. Colosio, Ejido)" required>
                <input type="number" step="any" id="nuevaLatitud" placeholder="Latitud GPS (ej. 20.6412)" required>
                <input type="number" step="any" id="nuevaLongitud" placeholder="Longitud GPS (ej. -87.0682)" required>
                <input type="url" id="nuevaMapsUrl" placeholder="Enlace de Google Maps (opcional)">

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn-search">Guardar en Base de Datos</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Rutas Alternas Playa - Universidad Tecnológica Riviera Maya (UTRM)</p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 0. CONTROL DE SEGURIDAD (Protección de Sesión)
        const usuarioSesion = localStorage.getItem('usuarioActivo');
        if (!usuarioSesion) {
            alert('Acceso no autorizado. Por favor inicia sesión primero.');
            window.location.href = 'login.html';
        }

        function cerrarSesion() {
            localStorage.removeItem('usuarioActivo');
            window.location.href = 'login.html';
        }

        // 1. Inicialización del Mapa centrado en Playa del Carmen
        const mapa = L.map('map').setView([20.6296, -87.0739], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(mapa);

        const iconoCoral = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        let todosLosLugares = [];
        let marcadoresActivos = [];

        // 2. Renderizado Dinámico de Marcadores y Tarjetas
        function renderizarLugares(lista) {
            marcadoresActivos.forEach(m => mapa.removeLayer(m));
            marcadoresActivos = [];

            const contenedorTarjetas = document.getElementById('contenedorTarjetas');
            if (contenedorTarjetas) contenedorTarjetas.innerHTML = '';

            if (!lista || lista.length === 0) {
                if (contenedorTarjetas) contenedorTarjetas.innerHTML = '<p style="text-align:center; width:100%;">No hay lugares registrados para mostrar.</p>';
                return;
            }

            lista.forEach(lugar => {
                let lat = lugar.coordenadas ? parseFloat(lugar.coordenadas[0]) : parseFloat(lugar.latitud);
                let lng = lugar.coordenadas ? parseFloat(lugar.coordenadas[1]) : parseFloat(lugar.longitud);

                const urlMapas = lugar.mapsUrl || lugar.google_maps_url || `https://maps.google.com/?q=${lat},${lng}`;

                if (!isNaN(lat) && !isNaN(lng)) {
                    const marker = L.marker([lat, lng], { icon: iconoCoral })
                        .addTo(mapa)
                        .bindPopup(`
                            <div style="text-align: center;">
                                <strong style="color: #2E4F4F; font-size: 14px;">${lugar.nombre}</strong><br>
                                <span style="font-size: 12px; color: #666;">${lugar.colonia}</span><br>
                                <span style="font-size: 12px; font-weight: bold; color: #33CCCC;">${lugar.especialidad}</span><br>
                                <a href="${urlMapas}" target="_blank" style="display: inline-block; margin-top: 6px; padding: 4px 8px; background-color: #FF8080; color: #FFF; border-radius: 4px; text-decoration: none; font-size: 11px;">Cómo Llegar</a>
                            </div>
                        `);
                    marcadoresActivos.push(marker);
                }

                if (contenedorTarjetas) {
                    const tarjetaHTML = `
                        <article class="card">
                            <div>
                                <span class="badge ${lugar.categoria === 'recreativo' ? 'badge-recreativo' : ''}">${lugar.especialidad}</span>
                                <h3>${lugar.nombre}</h3>
                                <p><strong>Ubicación:</strong> ${lugar.colonia}</p>
                            </div>
                            <button class="btn-search" onclick="window.open('${urlMapas}', '_blank')">Cómo Llegar (Maps)</button>
                        </article>
                    `;
                    contenedorTarjetas.innerHTML += tarjetaHTML;
                }
            });
        }

        // 3. Petición GET a MySQL en Railway
        function cargarDatosMySQL() {
            fetch('http://localhost:5000/api/lugares')
                .then(res => {
                    if (!res.ok) throw new Error('Error al conectar con la base de datos');
                    return res.json();
                })
                .then(data => {
                    todosLosLugares = data;
                    renderizarLugares(todosLosLugares);
                })
                .catch(err => console.error('Error al obtener datos de MySQL:', err));
        }

        window.onload = cargarDatosMySQL;

        // 4. Filtrar por Especialidad
        function filtrarMapa() {
            const categoria = document.getElementById('categoria').value;
            if (categoria === 'todos') {
                renderizarLugares(todosLosLugares);
            } else {
                const filtrados = todosLosLugares.filter(l => l.categoria === categoria);
                renderizarLugares(filtrados);
            }
        }

        // 5. Control de la Ventana Modal
        function abrirModal() {
            document.getElementById('modalAgregar').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modalAgregar').style.display = 'none';
            document.getElementById('formAgregarLugar').reset();
        }

        // 6. Guardar nuevo lugar en MySQL
        function guardarLugarBD(event) {
            event.preventDefault();

            const latInput = parseFloat(document.getElementById('nuevaLatitud').value);
            const lngInput = parseFloat(document.getElementById('nuevaLongitud').value);

            const nuevoLugar = {
                nombre: document.getElementById('nuevoNombre').value,
                categoria: document.getElementById('nuevaCategoria').value,
                especialidad: document.getElementById('nuevaEspecialidad').value,
                colonia: document.getElementById('nuevaColonia').value,
                latitud: latInput,
                longitud: lngInput,
                google_maps_url: document.getElementById('nuevaMapsUrl').value || `https://maps.google.com/?q=${latInput},${lngInput}`
            };

            fetch('http://localhost:5000/api/lugares', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevoLugar)
            })
            .then(res => res.json())
            .then(respuesta => {
                cerrarModal();
                mapa.flyTo([latInput, lngInput], 15);
                cargarDatosMySQL();
            })
            .catch(err => console.error('Error al guardar en MySQL:', err));
        }
    </script>
</body>
</html>
